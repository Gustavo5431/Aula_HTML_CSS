<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Corrigido: 'width=device-width' -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula Pratica</title>
</head>
<body>
    <h1>Aula8.html Pratica</h1>

    <form action="#" method="post">
        <fieldset>
            <legend>Formulario da Empresa</legend>
       
            <!-- Corrigido: IDs e Names exclusivos para cada campo -->
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" placeholder="Ex: Gustavo Cordeiro" required><br><br>
             
            <label for="endereco">Endereço:</label><br>
            <input type="text" id="endereco" name="endereco" placeholder="Ex: Rua Araça 67" required><br><br>

            <!-- Dica extra: Mudado para type="tel" que é melhor para telefone -->
            <label for="telefone">Telefone:</label><br>
            <input type="tel" id="telefone" name="telefone" placeholder="Ex: 19 99999-8888" required><br><br>

            <p>Interesse por qual departamento:</p>
            <!-- Corrigido: Checkboxes fechadas e com o atributo 'name' preenchido -->
            <input type="checkbox" id="comercial" name="departamento" value="comercial">
            <label for="comercial">Comercial</label><br>

            <input type="checkbox" id="tecnico" name="departamento" value="tecnico">
            <label for="tecnico">Técnico</label><br>

            <input type="checkbox" id="transportes" name="departamento" value="transportes">
            <label for="transportes">Transportes</label><br>

            <input type="checkbox" id="rh" name="departamento" value="rh">
            <label for="rh">RH</label><br>

            <input type="checkbox" id="ti" name="departamento" value="ti">
            <label for="ti">TI</label><br><br>

            <label for="estado-civil">Estado Civil:</label><br>
            <select id="estado-civil" name="estadoCivil">
                <option value="">Selecione...</option>
                <option value="solteiro">Solteiro(a)</option>
                <option value="casado">Casado(a)</option>
                <option value="divorciado">Divorciado(a)</option>
                <option value="viuvo">Viúvo(a)</option>
            </select>

        <!-- Corrigido: Faltava fechar essas duas tags no final -->
        </fieldset>
    </form>
</body>
</html>
